  build_release:
    runs-on: self-hosted
    outputs:
      BUILD_RELEASE: ${{ job.status }}
    steps:
    - name: Checkout 
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }}
        submodules: recursive
    - name: Check Code Style
      run: |
        FILES=$(git diff --name-only origin/develop | grep -E '\.c$|\.cpp$|\.h$' || true)
        if [ -n "$FILES" ]; then
          clang-format-15 -style=file --dry-run -output-replacements-xml $FILES \
            2>&1 | tee /home/hw-admin/actions-runner/_work/hwlt-mcuboot/hwlt-mcuboot/output.txt || true
          warning_count=$(grep -o 'warning:' /home/hw-admin/actions-runner/_work/hwlt-mcuboot/hwlt-mcuboot/output.txt | wc -l || true)
        else
          echo "No C/C++ files to check."
          warning_count=0
        fi
        echo "Number of warnings: $warning_count" > warning_count.txt
        cat warning_count.txt
    - name: Upload warning count artifact
      uses: actions/upload-artifact@v4
      with:
        name: warning_count
        path: warning_count.txt
    - name: Create Docker container and build project
      run: |
        docker run -d --rm --name dockerenv -u $(id -u ${USER}):$(id -g ${USER}) -v $(pwd):/usr/src/app hw-docker-image:0.1 sleep infinity
        docker exec dockerenv sh -c "cmake --fresh  -B buildReleaseSe -DCMAKE_BUILD_TYPE=Release -DHWLT_BOARD_REVISION="h7v3" && make -j8 -C buildReleaseSe 2>&1 | tee /usr/src/app/build_log.txt"
        docker exec dockerenv sh -c "grep -E 'Memory region|FLASH|DTCMRAM|RAM_D1|RAM_D2|RAM_D3|ITCMRAM' /usr/src/app/build_log.txt | grep -E '^[[:space:]]*Memory region|^ *[A-Z]' > /usr/src/app/memory_info.txt"
        python3 ./scripts/memory_info_format.py
        docker cp dockerenv:/usr/src/app/memory_info_modified.txt ./memory_info_release_modified.txt
        ls src/
    - name: Save Memory Release Info as Artifact
      uses: actions/upload-artifact@v4
      with:
        name: memory-release-info
        path: memory_info_release_modified.txt
    #- name: Copy and rename build result
      #run: |
        #commit_hash=$(echo "${{ github.sha }}" | cut -c 1-7)
        #mv build-release-h7v3/src/era-bootloader.bin "/home/hw-admin/ci/bootloader/test/${commit_hash}era-bootloader-release.bin"
        #mv src/era-bootloader_signed.bin "/home/hw-admin/ci/bootloader/test/${commit_hash}era-bootloader-release_signed.bin"
    - name: Delete docker
      run: |
        docker stop dockerenv || true
        docker rm dockerenv || true
      if: ${{ always() }}  
    - name: Delete Docker cache and images
      run: |
        docker system prune --all -f || true

