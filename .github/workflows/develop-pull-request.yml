  Send_status_to_slack:
    runs-on: self-hosted
    needs: [build_release]
    env:
      #BUILD_DEBUG: ${{ needs.build_debug.outputs.BUILD_DEBUG }}
      BUILD_RELEASE: ${{ needs.build_release.outputs.BUILD_RELEASE }}
      
    if: always()
    steps:
    #- name: Download Memory Debug Info Artifact
      #uses: actions/download-artifact@v4
      #with:
        #name: memory-info
    - name: Download Memory Release Info Artifact
      uses: actions/download-artifact@v4
      with:
        name: memory-release-info
    #- name: Download Scan-build info Artifact
      #uses: actions/download-artifact@v4
      #with:
        #name: scan-build
    - name: Download warning count artifact
      uses: actions/download-artifact@v4
      with:
        name: warning_count
        
    - name: Send notification
      env:
        SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
      run: |
       commit_hash=$(echo "${{ github.sha }}" | cut -c 1-7)
       repo_name=$(echo "${{ github.repository }}")
       workflow_name=$(echo "${{ github.workflow }}")
       user=$(echo "${{ github.actor }}")

       if [ "$BUILD_RELEASE" = "success" ] ; then
          workflow_status="success"
          icon="\u2705"
       else
          workflow_status="failure"
          icon="\u274C"
       fi

       #scan_build=$(cat scan-build.txt)
       #scan_build_escaped=$(echo "$scan_build" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
       #memory_info=$(cat memory_info_modified.txt)
       #memory_info_escaped=$(echo "$memory_info" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
       memory_info_release=$(cat memory_info_release_modified.txt)
       memory_info_release_escaped=$(echo "$memory_info_release" | sed 's/"/\\"/g' | sed ':a;N;$!ba;s/\n/\\n/g')
       
       warnings=$(cat warning_count.txt)

       payload='{
        "blocks": [
          {
                "type": "header",
                "text": {
                "type": "plain_text",
                "text": "'"$icon"' '"$workflow_status"'",
                "emoji": true
                    }
          },
          {
            "type": "section",
            "fields": [
              {
                "type": "mrkdwn",
                "text": "*Repository:*\n'"$repo_name"'"
              },
              {
                "type": "mrkdwn",
                "text": "*Workflow Name:*\n'"$workflow_name"'"
              },
              {
                "type": "mrkdwn",
                "text": "*Commit Hash:*\n'"$commit_hash"'"
              },
              {
                "type": "mrkdwn",
                "text": "*Jobs:*\nBuild Release: '$BUILD_RELEASE'"
              }
            ]
          },
          {
            "type": "context",
            "elements": [
              {
                "type": "mrkdwn",
                "text": "*Triggered by:* '"$user"'"
              }
            ]
          },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Memory Release:*\n'"$memory_info_release_escaped"'"
          }
        },
        {
          "type": "section",
          "text": {
            "type": "mrkdwn",
            "text": "*Code Style:*\n'"$warnings"'"
          }
        }
        ]
       }'

        curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK"
    - name: Delete Memory Info
      run: |
        rm -f memory_info.txt
        rm -f scan-build.txt
        rm -f memory_info_modified.txt
        rm -f warning_count.txt
